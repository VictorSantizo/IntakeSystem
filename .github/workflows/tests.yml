# 2026-07-27 code review (GH #7): the repo had a solid suite but no CI, so
# tests never ran automatically on push. Production runs on Windows with a
# bundled Python 3.14, so CI matches that: windows runner, same interpreter
# line. The suite is already runner-friendly -- every test uses temp DBs/config
# (conftest.py), the OCR path degrades gracefully without Tesseract, and all
# network calls (Anthropic, IMAP/POP3) are mocked.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Provide config.json (gitignored; a few classifier tests read the module-dir copy)
        run: copy config.example.json config.json
      - name: Run test suite
        run: python -m pytest
